name: CI Pipeline (Build, Test, Scan & GitOps)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. BACKEND CI (Lint & Unit Tests)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & API Tests
        run: npm test

  # ----------------------------------------------------------------------------
  # 2. FRONTEND CI (Lint & Production Bundle Build)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Web Bundle
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. SECURITY & VULNERABILITY SCAN
  # ----------------------------------------------------------------------------
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking for CI flow, records security insights

  # ----------------------------------------------------------------------------
  # 4. DOCKER BUILD & PUSH (Docker Hub)
  # ----------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

  # ----------------------------------------------------------------------------
  # 5. GITOPS MANIFEST UPDATE (Bridge to ArgoCD)
  # ----------------------------------------------------------------------------
  update-gitops-manifests:
    name: Update K8s GitOps Manifests
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Write Permissions
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update Image Tags in Kustomize
        run: |
          cd k8s-manifests
          kustomize edit set image todo-backend=${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
          kustomize edit set image todo-frontend=${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}

      - name: Commit & Push Updated GitOps Manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/kustomization.yaml
          git commit -m "chore(gitops): update app images to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main
