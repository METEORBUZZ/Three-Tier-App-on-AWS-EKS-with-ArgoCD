# ==============================================================================
# BACKEND CONFIGMAP (CKA APPLICATION CONFIGURATION PATTERN)
# ==============================================================================
# Non-sensitive runtime environment variables for the Node.js backend.
# Decouples application configuration from container image build.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: todo-app
  labels:
    app: todo-backend
    app.kubernetes.io/name: backend-config
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: todo-app
data:
  PORT: "5000"
  NODE_ENV: "production"
  CORS_ORIGIN: "*"
