# ==============================================================================
# HORIZONTAL POD AUTOSCALER (HPA) - BACKEND (CKAD AUTOSCALING PATTERN)
# ==============================================================================
# [CKA / CKAD BEST PRACTICE] Elastic Workload Autoscaling:
# Scales the todo-backend deployment between 2 and 5 replicas when average
# CPU utilization exceeds 70% or average Memory utilization exceeds 80%.
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todo-backend-hpa
  namespace: todo-app
  labels:
    app: todo-backend
    app.kubernetes.io/name: todo-backend-hpa
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: todo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todo-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down to prevent thrashing
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0 # React immediately to high traffic spikes
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
