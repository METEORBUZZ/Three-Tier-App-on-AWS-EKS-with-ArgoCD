# ==============================================================================
# BACKEND SECRET (CKA SENSITIVE DATA CONFIGURATION PATTERN)
# ==============================================================================
# Stores confidential credentials (database connection string).
# In production, integrate with external secret managers (e.g., AWS Secrets Manager,
# HashiCorp Vault, or External Secrets Operator).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: todo-app
  labels:
    app: todo-backend
    app.kubernetes.io/name: backend-secret
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongodb.todo-app.svc.cluster.local:27017/todo-db"
