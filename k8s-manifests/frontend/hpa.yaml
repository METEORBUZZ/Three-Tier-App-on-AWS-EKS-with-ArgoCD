# ==============================================================================
# HORIZONTAL POD AUTOSCALER (HPA) - FRONTEND (CKAD AUTOSCALING PATTERN)
# ==============================================================================
# Scales the todo-frontend Nginx deployment automatically between 2 and 5 pods.
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todo-frontend-hpa
  namespace: todo-app
  labels:
    app: todo-frontend
    app.kubernetes.io/name: todo-frontend-hpa
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: todo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todo-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
