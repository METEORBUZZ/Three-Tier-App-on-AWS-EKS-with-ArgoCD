# ==============================================================================
# POD DISRUPTION BUDGET (PDB) - FRONTEND (CKA CLUSTER UPGRADE PATTERN)
# ==============================================================================
# Guarantees that at least 1 frontend replica remains healthy during maintenance.
# ==============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todo-frontend-pdb
  namespace: todo-app
  labels:
    app: todo-frontend
    app.kubernetes.io/name: todo-frontend-pdb
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: todo-frontend
