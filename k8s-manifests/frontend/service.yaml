# ==============================================================================
# FRONTEND SERVICE (CKA SERVICE DISCOVERY PATTERN)
# ==============================================================================
# Internal ClusterIP service exposing the Nginx web frontend to the Ingress.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  namespace: todo-app
  labels:
    app: todo-frontend
    app.kubernetes.io/name: todo-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: todo-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: todo-frontend
