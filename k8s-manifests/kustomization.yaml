# ==============================================================================
# KUSTOMIZE ROOT (CKA / CKAD DECLARATIVE GITOPS CONFIGURATION)
# ==============================================================================
# Aggregates and overlays all Kubernetes resources for the todo-app workload.
# Enables deterministic dry-run validation via: kubectl kustomize k8s-manifests/
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

  # 1. Namespace & Pod Security Admission

  # 2. Network Policies (Zero-Trust Network Isolation)

  # 3. Database Layer (MongoDB)

  # 4. Backend Application Layer (Node.js API)

  # 5. Frontend Application Layer (React + Nginx)

  # 6. Ingress Routing Layer
resources:
- namespace.yaml
- networkpolicies/default-deny.yaml
- networkpolicies/frontend-netpol.yaml
- networkpolicies/backend-netpol.yaml
- networkpolicies/mongodb-netpol.yaml
- mongodb/pvc.yaml
- mongodb/deployment.yaml
- mongodb/service.yaml
- backend/configmap.yaml
- backend/secret.yaml
- backend/deployment.yaml
- backend/service.yaml
- backend/hpa.yaml
- backend/pdb.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- frontend/hpa.yaml
- frontend/pdb.yaml
- ingress.yaml

# Common Labels applied across all managed resources (Kustomize v5 standard)
labels:
- pairs:
    app.kubernetes.io/managed-by: gitops
    app.kubernetes.io/part-of: todo-app

# [GITOPS IMAGE TRACKING]
# Updated automatically by GitHub Actions CI when new container images are built
images:
- name: todo-backend
  newTag: cd97a55b57f9060e7caffafbe233df115610a5de
- name: todo-frontend
  newTag: cd97a55b57f9060e7caffafbe233df115610a5de
