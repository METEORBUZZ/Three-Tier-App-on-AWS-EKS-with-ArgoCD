# ==============================================================================
# MONGODB SERVICE (CKA SERVICE DISCOVERY & NETWORKING)
# ==============================================================================
# Internal ClusterIP service exposing MongoDB exclusively on port 27017.
# DNS: mongodb.todo-app.svc.cluster.local
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: todo-app
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: todo-app
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP
  selector:
    app: mongodb
