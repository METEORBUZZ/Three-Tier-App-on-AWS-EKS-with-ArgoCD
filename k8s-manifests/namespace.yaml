# ==============================================================================
# NAMESPACE DEFINITION (CKA EXAM / PRODUCTION BEST PRACTICE)
# ==============================================================================
# - Provides isolated multi-tenant boundary for the todo-app workload.
# - Pod Security Standards (PSS): Configured with 'baseline' enforcement and
#   'restricted' audit/warn to enforce non-root, capability drop, and seccomp.
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
  labels:
    name: todo-app
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/part-of: todo-app
    app.kubernetes.io/managed-by: kustomize
    # [CKA BEST PRACTICE] Pod Security Admission (PSA) Standards
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
