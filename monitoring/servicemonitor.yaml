apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-backend-monitor
  namespace: todo-app
  labels:
    release: prometheus
    app: todo-backend
spec:
  selector:
    matchLabels:
      app: todo-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
